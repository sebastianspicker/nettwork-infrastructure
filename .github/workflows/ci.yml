name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    timeout-minutes: 45
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select full Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          full_xcode_developer_dir=""

          if [[ -d "/Applications/Xcode.app/Contents/Developer" ]]; then
            full_xcode_developer_dir="/Applications/Xcode.app/Contents/Developer"
          else
            for candidate in /Applications/Xcode*.app/Contents/Developer; do
              if [[ -d "$candidate" ]]; then
                full_xcode_developer_dir="$candidate"
              fi
            done
          fi

          if [[ -n "$full_xcode_developer_dir" ]]; then
            sudo xcode-select --switch "$full_xcode_developer_dir"
          fi

          xcode-select --print-path
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked Node tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install shell analyzers and XcodeGen
        run: brew install shellcheck shfmt xcodegen ripgrep jq

      - name: Verify source
        run: make verify-source

      - name: Build NettworkCore package
        run: make verify-package

      - name: Build macOS and iOS Simulator apps
        run: make verify-native
