name: Nettwork

options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "16.0"
  projectFormat: xcode16_0
  createIntermediateGroups: true

packages:
  NettworkCore:
    path: Packages/NettworkCore

targetTemplates:
  NettworkApp:
    type: application
    sources:
      - path: NettworkApp
        excludes:
          - Resources/Info.plist
          - "*.entitlements"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        INFOPLIST_FILE: NettworkApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: NettworkCore
        product: NetworkModel
      - package: NettworkCore
        product: WorkspaceChangeControl
      - package: NettworkCore
        product: Persistence
      - package: NettworkCore
        product: CloudSync
      - package: NettworkCore
        product: ContentSafety
      - package: NettworkCore
        product: ImportExport
      - package: NettworkCore
        product: FeatureContracts
      - package: NettworkCore
        product: WorkspaceServices

targets:
  Nettwork:
    templates: [NettworkApp]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nettwork
        CODE_SIGN_ENTITLEMENTS: Config/Nettwork-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

  NettworkMac:
    templates: [NettworkApp]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nettwork.mac
        CODE_SIGN_ENTITLEMENTS: Config/Nettwork-macOS.entitlements

schemes:
  Nettwork:
    build:
      targets:
        Nettwork: all
  Nettwork macOS:
    build:
      targets:
        NettworkMac: all
