name: Nettwork

options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "16.0"
  projectFormat: xcode16_0
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GENERATE_INFOPLIST_FILE: NO

packages:
  NettworkCore:
    path: Packages/NettworkCore

targets:
  Nettwork:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: NettworkApp
        excludes:
          - Resources/Info.plist
          - "*.entitlements"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: Nettwork
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nettwork
        INFOPLIST_FILE: NettworkApp/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Nettwork-iOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: NettworkCore
        product: NetworkModel
      - package: NettworkCore
        product: WorkspaceChangeControl
      - package: NettworkCore
        product: Persistence
      - package: NettworkCore
        product: CloudSync
      - package: NettworkCore
        product: ContentSafety
      - package: NettworkCore
        product: ImportExport

  NettworkMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: NettworkApp
        excludes:
          - Resources/Info.plist
          - "*.entitlements"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: Nettwork
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nettwork.mac
        INFOPLIST_FILE: NettworkApp/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Nettwork-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: NettworkCore
        product: NetworkModel
      - package: NettworkCore
        product: WorkspaceChangeControl
      - package: NettworkCore
        product: Persistence
      - package: NettworkCore
        product: CloudSync
      - package: NettworkCore
        product: ContentSafety
      - package: NettworkCore
        product: ImportExport

  NettworkTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Tests/App
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: NettworkTests
        PRODUCT_MODULE_NAME: NettworkTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Nettwork

  NettworkMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Tests/App
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: NettworkMacTests
        PRODUCT_MODULE_NAME: NettworkMacTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nettwork.app/Contents/MacOS/Nettwork"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: NettworkMac

schemes:
  Nettwork:
    build:
      targets:
        Nettwork: all
        NettworkTests: [test]
    test:
      targets:
        - NettworkTests
  Nettwork macOS:
    build:
      targets:
        NettworkMac: all
        NettworkMacTests: [test]
    test:
      targets:
        - NettworkMacTests
